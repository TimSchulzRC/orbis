name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going: no runner time for
# outdated commits, and an older image build can never overwrite a newer :dev.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The self-hosted runner (label "obtion") when the repository variable RUNNER says so, otherwise
    # GitHub's: RUNNER=obtion switches to our own hardware, deleting the variable switches back.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # a hanging test fails after minutes instead of holding the runner for GitHub's six hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # always the newest Bun release, like the Dockerfile's base image (kept current by Dependabot)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # tests, typecheck and build don't depend on each other: in parallel they take half the time.
      # Each one's output is printed in its own group, the step fails if any of them failed.
      - name: Test, typecheck, build
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          bun test > "$RUNNER_TEMP/check/test.log" 2>&1 & test=$!
          bun run typecheck > "$RUNNER_TEMP/check/typecheck.log" 2>&1 & typecheck=$!
          bun run build > "$RUNNER_TEMP/check/build.log" 2>&1 & build=$!
          failed=0
          for name in test typecheck build; do
            if wait "${!name}"; then result=ok; else result=FAILED; failed=1; fi
            echo "::group::$name: $result"
            cat "$RUNNER_TEMP/check/$name.log"
            echo "::endgroup::"
            [ "$result" = ok ] || echo "::error::$name failed"
          done
          exit $failed

  # The browser tests (tests/e2e): every route and the editor in a real Chromium, on desktop and
  # phone. Beside check, not in it: they take a few minutes.
  e2e:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      SELF_HOSTED: ${{ vars.RUNNER != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # the Chromium of the installed playwright-core (~/.cache/ms-playwright, kept on the
      # self-hosted machine); GitHub's runners also need its system libraries, which the
      # self-hosted one has (installing them would need root)
      - run: bunx playwright-core install ${{ env.SELF_HOSTED != 'true' && '--with-deps' || '' }} chromium
      - run: bun run test:e2e

  # The dev channel of the image ghcr.io/<owner>/obtion: :dev is always the newest main,
  # :sha-<commit> keeps each build (release.yml builds nightly and stable only from commits that
  # have one). Only after the checks and the browser tests passed. For pull requests the image is
  # built and started as well, so a broken Dockerfile shows before the merge, but never pushed.
  image:
    needs: [check, e2e]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SELF_HOSTED: ${{ vars.RUNNER != '' }}
      PUSH: ${{ github.event_name == 'push' }}
      LOCAL_TAG: obtion-ci:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      # Self-hosted: the Docker daemon's own builder (containerd image store), its build cache stays
      # on the machine between runs, nothing to export. GitHub's runners start empty each time and
      # carry the cache through the GitHub Actions cache instead.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ env.SELF_HOSTED == 'true' && 'docker' || 'docker-container' }}
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha
      # first only for the runner's platform, loaded into Docker and started: the image has to
      # answer before anything is pushed (.github/scripts/check-image.sh)
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            OBTION_BUILD_VERSION=dev
            OBTION_BUILD_COMMIT=${{ github.sha }}
          cache-from: ${{ env.SELF_HOSTED != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.SELF_HOSTED != 'true' && 'type=gha,mode=max' || '' }}
      - name: Start the image
        run: bash .github/scripts/check-image.sh "$LOCAL_TAG" dev "$GITHUB_SHA"
      # then both platforms, mostly from the cache of the build above
      - uses: docker/build-push-action@v7
        if: env.PUSH == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OBTION_BUILD_VERSION=dev
            OBTION_BUILD_COMMIT=${{ github.sha }}
          cache-from: ${{ env.SELF_HOSTED != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.SELF_HOSTED != 'true' && 'type=gha,mode=max' || '' }}
      # the docker builder also keeps the built images locally: drop exactly these tags, the build
      # cache stays (other containers on the machine are none of CI's business)
      - name: Remove local image tags
        if: always() && env.SELF_HOSTED == 'true' && steps.meta.outcome == 'success'
        run: docker image rm "$LOCAL_TAG" ${{ env.PUSH == 'true' && join(fromJSON(steps.meta.outputs.json).tags, ' ') || '' }} || true
