name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going: no runner time for
# outdated commits, and an older image build can never overwrite a newer :dev.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # GitHub's runners only: the repository is public, and a pull request from a fork must not run
    # its code on a machine of our own (docs/ci.md)
    runs-on: ubuntu-latest
    # a hanging test fails after minutes instead of holding the runner for GitHub's six hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # always the newest Bun release, like the Dockerfile's base image (kept current by Dependabot)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # the Chromium of the installed Playwright, with its system libraries
      - run: bunx playwright install --with-deps chromium
      # Biome, unit and integration tests, typecheck, browser tests (parts of the interface on their
      # own in Chromium, tests/browser) and E2E (the built app against real servers, tests/e2e): side
      # by side, the same script as `bun run check` locally
      - run: bash scripts/check
      # the screenshots Vitest takes of a failed browser test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-screenshots
          path: .vitest/attachments
          if-no-files-found: ignore

  # The image, built for the runner's platform and started: it has to answer before anything is
  # pushed (.github/scripts/check-image.sh). Beside check, not after it: for pull requests too, so a
  # broken Dockerfile shows before the merge.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCAL_TAG: obtion-ci:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      # the runner starts empty each time: the build cache goes through the GitHub Actions cache
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            OBTION_BUILD_VERSION=dev
            OBTION_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image
        run: bash .github/scripts/check-image.sh "$LOCAL_TAG" dev "$GITHUB_SHA"

  # The dev channel of the image ghcr.io/<owner>/obtion: :dev is always the newest main,
  # :sha-<commit> keeps each build (release.yml builds nightly and stable only from commits that
  # have one). Only for main, after the checks passed and the image started; both platforms,
  # mostly from the cache of the image job.
  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # builder and cache as in the image job
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OBTION_BUILD_VERSION=dev
            OBTION_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
