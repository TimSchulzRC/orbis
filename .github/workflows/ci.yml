name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going: no runner time for
# outdated commits, and an older image build can never overwrite a newer :dev.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The self-hosted runner (label "obtion") when the repository variable RUNNER says so, otherwise
    # GitHub's: RUNNER=obtion switches to our own hardware, deleting the variable switches back.
    # The machine has two runners, so check and image run side by side (docs/ci.md).
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # a hanging test fails after minutes instead of holding the runner for GitHub's six hours
    timeout-minutes: 15
    env:
      SELF_HOSTED: ${{ vars.RUNNER != '' }}
    steps:
      - uses: actions/checkout@v7
      # always the newest Bun release, like the Dockerfile's base image (kept current by Dependabot):
      # GitHub's runners install it, the self-hosted machine has it and upgrades it in place (in
      # half a second instead of ten; one at a time, its runners share it)
      - uses: oven-sh/setup-bun@v2
        if: env.SELF_HOSTED != 'true'
        with:
          bun-version: latest
      # the runner's service starts without ~/.bun/bin in its PATH: this step and the ones after get it
      - if: env.SELF_HOSTED == 'true'
        run: |
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          flock ~/.bun/upgrade.lock ~/.bun/bin/bun upgrade
      - run: bun install --frozen-lockfile
      # the Chromium of the installed Playwright (~/.cache/ms-playwright, kept on the self-hosted
      # machine); GitHub's runners also need its system libraries, which the self-hosted one has
      # (installing them would need root)
      - run: bunx playwright install ${{ env.SELF_HOSTED != 'true' && '--with-deps' || '' }} chromium
      # Biome, unit and integration tests, typecheck, browser tests (parts of the interface on their
      # own in Chromium, tests/browser) and E2E (the built app against real servers, tests/e2e): side
      # by side, the same script as `bun run check` locally
      - run: bash scripts/check
      # the screenshots Vitest takes of a failed browser test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-screenshots
          path: .vitest/attachments
          if-no-files-found: ignore

  # The image, built for the runner's platform and started: it has to answer before anything is
  # pushed (.github/scripts/check-image.sh). Beside check, not after it: for pull requests too, so a
  # broken Dockerfile shows before the merge.
  image:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      SELF_HOSTED: ${{ vars.RUNNER != '' }}
      LOCAL_TAG: obtion-ci:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      # Self-hosted: the Docker daemon's own builder (containerd image store), its build cache stays
      # on the machine between runs, nothing to export. GitHub's runners start empty each time and
      # carry the cache through the GitHub Actions cache instead.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ env.SELF_HOSTED == 'true' && 'docker' || 'docker-container' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            OBTION_BUILD_VERSION=dev
            OBTION_BUILD_COMMIT=${{ github.sha }}
          cache-from: ${{ env.SELF_HOSTED != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.SELF_HOSTED != 'true' && 'type=gha,mode=max' || '' }}
      - name: Start the image
        run: bash .github/scripts/check-image.sh "$LOCAL_TAG" dev "$GITHUB_SHA"
      # the docker builder keeps the image locally: drop the tag, the build cache stays
      - name: Remove the local image tag
        if: always() && env.SELF_HOSTED == 'true'
        run: docker image rm "$LOCAL_TAG" || true

  # The dev channel of the image ghcr.io/<owner>/obtion: :dev is always the newest main,
  # :sha-<commit> keeps each build (release.yml builds nightly and stable only from commits that
  # have one). Only for main, after the checks passed and the image started; both platforms,
  # mostly from the cache of the image job.
  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SELF_HOSTED: ${{ vars.RUNNER != '' }}
    steps:
      - uses: actions/checkout@v7
      # builder and cache as in the image job
      - uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ env.SELF_HOSTED == 'true' && 'docker' || 'docker-container' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OBTION_BUILD_VERSION=dev
            OBTION_BUILD_COMMIT=${{ github.sha }}
          cache-from: ${{ env.SELF_HOSTED != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.SELF_HOSTED != 'true' && 'type=gha,mode=max' || '' }}
      # the docker builder also keeps the pushed image locally: drop exactly these tags, the build
      # cache stays (other containers on the machine are none of CI's business)
      - name: Remove local image tags
        if: always() && env.SELF_HOSTED == 'true' && steps.meta.outcome == 'success'
        run: docker image rm ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }} || true
