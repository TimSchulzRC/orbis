name: Release

# Three channels of one image, ghcr.io/<owner>/obtion, and of the desktop app (its installers on
# each GitHub release; the app looks there for a newer one of its channel: apps/desktop/src/updates.ts):
#   dev      every push to main (ci.yml): :dev and :sha-<commit>
#   nightly  this workflow, checked every half hour: a new one when main has commits the last one
#            lacks and that one is at least six hours old; by hand without the wait. GitHub's
#            schedule drops most of its runs for this repository, so a machine of our own
#            starts the check too (dispatch with auto: scripts/systemd/obtion-nightly-check.*).
#            :nightly and :0.0.2-nightly.20261030.1, a GitHub pre-release v0.0.2-nightly.20261030.1
#   stable   this workflow, only by hand: the commit of the latest nightly, so stable only ever
#            ships what ran as nightly. :stable, :latest and :0.0.2, a GitHub release v0.0.2 titled
#            "Obtion 0.0.2 (Alpha)": the stage stays in the name until Obtion leaves it
# The last number of a version counts the stable releases; a new middle one (0.1.0: beta) is
# given by hand as version. Details in .github/scripts/resolve-release.sh.

on:
  schedule:
    # not at minute zero, when GitHub's scheduled jobs are busiest
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        default: nightly
        options: [nightly, stable]
      version:
        description: "Only for stable, e.g. 0.1.0. Default: the version the latest nightly led up to."
        required: false
        type: string
      auto:
        description: "Like the schedule: a nightly only when due (six hours, new commits)"
        type: boolean
        default: false

# one nightly at a time (a waiting one checks again when it starts), stable apart from it
concurrency:
  group: release-${{ inputs.channel == 'stable' && 'stable' || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    # like ci.yml: GitHub's runners only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      title: ${{ steps.resolve.outputs.title }}
      tags: ${{ steps.resolve.outputs.tags }}
      notes: ${{ steps.resolve.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        run: bash .github/scripts/resolve-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          AUTO: ${{ github.event_name == 'schedule' || inputs.auto }}
          SHA: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.version }}

  release:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      LOCAL_TAG: obtion-release:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # the scripts as of the workflow, not of the commit it builds (which may predate them)
      - uses: actions/checkout@v7
        with:
          path: .workflow
          sparse-checkout: .github/scripts
      # builder and cache as in ci.yml
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
      # the same commit dev ran, built again only to carry its version; started first like in
      # ci.yml, so it has to show that version before it is pushed
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            OBTION_BUILD_VERSION=${{ needs.resolve.outputs.version }}
            OBTION_BUILD_COMMIT=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image
        run: bash .workflow/.github/scripts/check-image.sh "$LOCAL_TAG" "$VERSION" "$SHA"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.resolve.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OBTION_BUILD_VERSION=${{ needs.resolve.outputs.version }}
            OBTION_BUILD_COMMIT=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # after the image: a release always has its image
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TITLE: ${{ needs.resolve.outputs.title }}
          SHA: ${{ needs.resolve.outputs.sha }}
          NOTES: ${{ needs.resolve.outputs.notes }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
        run: |
          args=(--target "$SHA" --title "$TITLE" --generate-notes)
          [[ -n $NOTES ]] && args+=(--notes-start-tag "$NOTES")
          if [[ $CHANNEL == stable ]]; then args+=(--latest); else args+=(--prerelease --latest=false); fi
          gh release create "v$VERSION" "${args[@]}"

  # the desktop app of this release, built like in desktop.yml but with its version: the installers
  # go onto the release, where the apps of this channel find them
  desktop:
    needs: [resolve, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: mac, arch: --x64 --arm64 }
          - { runner: windows-latest, platform: win, arch: --x64 }
          - { runner: ubuntu-latest, platform: linux, arch: --x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts ${{ matrix.platform }}
        env:
          OBTION_BUILD_VERSION: ${{ env.VERSION }}
      - run: bunx electron-builder --${{ matrix.platform }} ${{ matrix.arch }} --publish never -c.extraMetadata.version="$VERSION"
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.AppImage release/*.deb)
          ((${#files[@]})) || { echo "::error::No installers in release/"; exit 1; }
          gh release upload "v$VERSION" "${files[@]}" --clobber
