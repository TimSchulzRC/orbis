<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" name="viewport" />
    <meta content="#f7f6f3" name="theme-color" />
    <script>
      // light or dark before the first paint (per device; see packages/ui/src/theme.ts)
      try {
        var c = localStorage.getItem("obtion.theme");
        var d = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", d ? "#191919" : "#f7f6f3");
      } catch (e) {}
    </script>
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <link href="/icon-dark.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <title>Obtion</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module" ></script>
  </body>
</html>
