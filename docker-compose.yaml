# Obtion on a NAS or any Docker host: put this file into a folder, `docker compose up -d`, open
# http://<any address of the host>:8480. Optional settings go into .env next to it (see
# .env.example). Update: `docker compose pull && docker compose up -d`.
services:
  obtion:
    # the channel or a fixed version with OBTION_VERSION: latest (= stable, the default), nightly,
    # dev, or e.g. 0.0.2 (see .github/workflows/release.yml)
    image: ghcr.io/timschulzrc/obtion:${OBTION_VERSION:-latest}
    restart: unless-stopped
    ports:
      # on every address of the host (LAN, tailnet, …); the first account created on the page
      # becomes the admin
      - "${OBTION_BIND:-0.0.0.0}:${OBTION_PORT:-8480}:8480"
    volumes:
      # an ordinary folder on the host: database, daily backups, files, Markdown mirror. Created
      # if missing; the server runs as its owner (or OBTION_UID/OBTION_GID), never as root
      - ${OBTION_DATA_DIR:-./data}:/data
    environment:
      OBTION_UID: ${OBTION_UID:-}
      OBTION_GID: ${OBTION_GID:-}
      OBTION_PUBLIC_URL: ${OBTION_PUBLIC_URL:-}
      OBTION_ALLOWED_HOSTS: ${OBTION_ALLOWED_HOSTS:-}
      OBTION_WEB_APP: ${OBTION_WEB_APP:-on}
      # who may create an account: invite (with an invite link), open (anyone), off
      OBTION_SIGNUP: ${OBTION_SIGNUP:-invite}
