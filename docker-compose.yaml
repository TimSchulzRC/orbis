# Obtion on a NAS or any Docker host: clone the repository, `docker compose up -d`, open
# http://<any address of the host>:8480. Optional settings go into .env (see .env.example;
# not in git, so `git pull` never collides with them).
services:
  obtion:
    build: .
    image: obtion-server
    restart: unless-stopped
    ports:
      # on every address of the host (LAN, tailnet, …); the first account created on the page
      # becomes the admin
      - "${OBTION_BIND:-0.0.0.0}:${OBTION_PORT:-8480}:8480"
    volumes:
      # an ordinary folder on the host: database, daily backups, files, Markdown mirror
      - ${OBTION_DATA_DIR:-./data}:/data
    environment:
      OBTION_PUBLIC_URL: ${OBTION_PUBLIC_URL:-}
      OBTION_ALLOWED_HOSTS: ${OBTION_ALLOWED_HOSTS:-}
      OBTION_WEB_APP: ${OBTION_WEB_APP:-on}
      # who may create an account: invite (with an invite link), open (anyone), off
      OBTION_SIGNUP: ${OBTION_SIGNUP:-invite}
      # who may use the in-app agent (the server's Claude login): admins, all, off
      OBTION_AGENT: ${OBTION_AGENT:-admins}
