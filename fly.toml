# Obtion on Fly.io: one machine with a volume for /data (database, backups, files).
# Once: `fly scale count 1` and `fly volume create obtion_data -r fra -n 1 -s 1`; then
# `fly deploy --ha=false` (never a second machine: it would have its own database).
# See https://fly.io/docs/reference/configuration/

app = 'obtion'
primary_region = 'fra'

[build]

[env]
  # the server only answers under names it knows; obtion.fly.dev is a public one
  OBTION_PUBLIC_URL = 'https://obtion.fly.dev'
  OBTION_SIGNUP = 'invite'
  # the image has no Claude login; agents connect from outside through MCP
  OBTION_AGENT = 'off'

# SQLite needs one machine with its own disk; never more than one
[mounts]
  source = 'obtion_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8480
  force_https = true
  # stops when nobody is connected and starts on the next request (a few seconds)
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
